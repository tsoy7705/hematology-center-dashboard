<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Единая панель деятельности подразделений центра гематологии: календарь, задачи, заявки, склад и сообщения.">
<meta name="theme-color" content="#7A1B3B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гематология">
<title>Центр гематологии</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#F5F2F4;
  --bg-raised:#FFFFFF;
  --surface:#FFFFFF;
  --surface-muted:#FAF7F8;
  --surface-hover:#F1EAEE;
  --border:#E5DEE2;
  --border-strong:#D2C7CD;
  --text:#241B1F;
  --text-secondary:#6C6167;
  --text-faint:#9A8D93;
  --accent:#7A1B3B;
  --accent-strong:#5E1530;
  --accent-soft:#F3E1E7;
  --accent-contrast:#FFFFFF;
  --focus:#B0567A;

  --status-neutral:#8C8690;    --status-neutral-bg:#ECE9EA;
  --status-progress:#B8790E;   --status-progress-bg:#F8EDD9;
  --status-done:#3E8F58;       --status-done-bg:#E1F1E7;
  --status-overdue:#C23B3B;    --status-overdue-bg:#F9E2E2;

  --priority-low:#8C8690;      --priority-low-bg:#ECE9EA;
  --priority-medium:#3E76A8;   --priority-medium-bg:#DFEBF3;
  --priority-high:#B8790E;     --priority-high-bg:#F8EDD9;
  --priority-critical:#AC3434; --priority-critical-bg:#F6DFDF;

  --shadow-sm:0 1px 2px rgba(36,27,31,.07);
  --shadow-md:0 10px 28px rgba(36,27,31,.14);
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --dept-brightness:1;
  --font-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'Consolas',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18121A;
    --bg-raised:#1E1720;
    --surface:#221A24;
    --surface-muted:#2A2129;
    --surface-hover:#302631;
    --border:#3B2E3B;
    --border-strong:#4D3C4C;
    --text:#F2E9EC;
    --text-secondary:#BCAEB6;
    --text-faint:#8B7C85;
    --accent:#E2688F;
    --accent-strong:#EE8AA7;
    --accent-soft:#3B2130;
    --accent-contrast:#241019;
    --focus:#E2688F;

    --status-neutral:#A79BA3;   --status-neutral-bg:#332A32;
    --status-progress:#E3AA47;  --status-progress-bg:#3B2E17;
    --status-done:#63C283;      --status-done-bg:#193828;
    --status-overdue:#E67A76;   --status-overdue-bg:#3C1E1E;

    --priority-low:#A79BA3;     --priority-low-bg:#332A32;
    --priority-medium:#78B2DB;  --priority-medium-bg:#1B2E3A;
    --priority-high:#E3AA47;    --priority-high-bg:#3B2E17;
    --priority-critical:#E67A76;--priority-critical-bg:#3C1E1E;
    --dept-brightness:1.22;
  }
}
:root[data-theme="dark"]{
  --bg:#18121A;
  --bg-raised:#1E1720;
  --surface:#221A24;
  --surface-muted:#2A2129;
  --surface-hover:#302631;
  --border:#3B2E3B;
  --border-strong:#4D3C4C;
  --text:#F2E9EC;
  --text-secondary:#BCAEB6;
  --text-faint:#8B7C85;
  --accent:#E2688F;
  --accent-strong:#EE8AA7;
  --accent-soft:#3B2130;
  --accent-contrast:#241019;
  --focus:#E2688F;

  --status-neutral:#A79BA3;   --status-neutral-bg:#332A32;
  --status-progress:#E3AA47;  --status-progress-bg:#3B2E17;
  --status-done:#63C283;      --status-done-bg:#193828;
  --status-overdue:#E67A76;   --status-overdue-bg:#3C1E1E;

  --priority-low:#A79BA3;     --priority-low-bg:#332A32;
  --priority-medium:#78B2DB;  --priority-medium-bg:#1B2E3A;
  --priority-high:#E3AA47;    --priority-high-bg:#3B2E17;
  --priority-critical:#E67A76;--priority-critical-bg:#3C1E1E;
  --dept-brightness:1.22;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1180px;margin:0 auto;padding:20px 20px 56px;}
h1,h2,h3{text-wrap:balance;margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:22px 0 18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:42px;height:42px;border-radius:11px;flex:none;
  background:linear-gradient(155deg,var(--accent),var(--accent-strong));
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);
}
.brand-mark svg{width:22px;height:22px;}
.brand-text h1{font-size:20px;font-weight:800;letter-spacing:-0.01em;}
.brand-text p{margin:2px 0 0;font-size:13px;color:var(--text-secondary);}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.role-badge{
  display:flex;align-items:center;gap:7px;border-radius:999px;border:1px dashed var(--border-strong);
  background:var(--surface);color:var(--text-secondary);font-weight:700;font-size:12.5px;padding:7px 13px 7px 8px;cursor:pointer;
  box-shadow:var(--shadow-sm);
}
.role-badge:hover{background:var(--surface-hover);}
.role-badge.has-role{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.role-badge .role-badge-icon{width:22px;height:22px;border-radius:50%;background:var(--surface-muted);display:flex;align-items:center;justify-content:center;flex:none;}
.role-badge.has-role .role-badge-icon{background:var(--bg-raised);}
.role-badge svg{width:13px;height:13px;}
.theme-toggle{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;box-shadow:var(--shadow-sm);}
.theme-toggle button{
  width:32px;height:32px;border-radius:999px;border:none;background:transparent;color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.theme-toggle button svg{width:16px;height:16px;}
.theme-toggle button.active{background:var(--accent);color:var(--accent-contrast);}

.role-hint{color:var(--text-secondary);font-size:13px;margin:-6px 0 14px;}
.role-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
@media (max-width:420px){.role-grid{grid-template-columns:minmax(0,1fr);}}
.role-option{
  display:flex;align-items:center;gap:10px;border:1px solid var(--border-strong);border-radius:12px;
  background:var(--surface);color:var(--text);padding:12px;cursor:pointer;text-align:left;font-weight:700;font-size:13.5px;
}
.role-option:hover{background:var(--surface-hover);}
.role-option.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.role-option .role-icon{width:34px;height:34px;border-radius:9px;background:var(--surface-muted);display:flex;align-items:center;justify-content:center;flex:none;}
.role-option.selected .role-icon{background:var(--bg-raised);}
.role-option svg{width:18px;height:18px;}
.demo-banner{
  max-width:1180px;margin:0 auto 14px;padding:10px 16px;border-radius:var(--radius-sm);
  background:var(--status-progress-bg);color:var(--status-progress);border:1px solid var(--status-progress);
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;
}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);padding-bottom:0;margin-bottom:20px;scrollbar-width:thin;}
.tab-btn{
  flex:none;border:none;background:transparent;color:var(--text-secondary);font-weight:700;font-size:14px;
  padding:10px 16px;border-radius:10px 10px 0 0;cursor:pointer;position:relative;top:1px;white-space:nowrap;
  border-bottom:2px solid transparent;
}
.tab-btn:hover{color:var(--text);background:var(--surface-hover);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ---------- generic ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);font-weight:700;font-size:13.5px;padding:9px 14px;cursor:pointer;
}
.btn:hover{background:var(--surface-hover);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-hover);}
.btn-danger{color:var(--status-overdue);}
.btn-danger-confirm{background:var(--status-overdue);border-color:var(--status-overdue);color:#fff;}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.field label{font-size:12.5px;font-weight:700;color:var(--text-secondary);}
.field input[type="text"],.field input[type="date"],.field input[type="time"],.field select,.field textarea{
  border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);color:var(--text);
  padding:9px 11px;font-size:14px;width:100%;
}
.field input[type="date"],.field input[type="time"]{font-family:var(--font-mono);}
.field textarea{resize:vertical;min-height:64px;}
.field-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;}
@media (max-width:520px){.field-row{grid-template-columns:minmax(0,1fr);}}

.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;
}
.dept-dot{width:9px;height:9px;border-radius:50%;flex:none;filter:brightness(var(--dept-brightness));}
.dept-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary);font-weight:600;}

/* ---------- overview ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:22px;}
@media (max-width:900px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:420px){.kpi-grid{grid-template-columns:minmax(0,1fr);}}
.kpi-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);min-width:0;}
.kpi-tile .kpi-value{font-family:var(--font-mono);font-size:28px;font-weight:600;line-height:1;}
.kpi-tile .kpi-label{margin-top:8px;font-size:12.5px;color:var(--text-secondary);font-weight:600;}

.panels-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:22px;}
@media (max-width:760px){.panels-row{grid-template-columns:minmax(0,1fr);}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);min-width:0;}
.panel h3{font-size:14.5px;font-weight:800;margin-bottom:12px;}
.panel-list{display:flex;flex-direction:column;gap:2px;}
.list-row{
  display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:8px;cursor:pointer;min-width:0;
}
.list-row:hover{background:var(--surface-hover);}
.list-row .lr-title{font-weight:700;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-row .lr-meta{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
.empty-note{color:var(--text-faint);font-size:13px;padding:8px 6px;}

.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.dept-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;cursor:pointer;
  box-shadow:var(--shadow-sm);min-width:0;
}
.dept-card:hover{border-color:var(--border-strong);background:var(--surface-hover);}
.dept-card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.dept-card-top .dept-dot{width:11px;height:11px;}
.dept-card-top .name{font-weight:800;font-size:14px;}
.dept-card .head{font-size:12.5px;color:var(--text-secondary);margin-bottom:10px;}
.dept-card .counts{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--text-secondary);}
.dept-card .counts .mono{font-size:15px;color:var(--text);}
.dept-card .nearest{margin-top:8px;font-size:12px;color:var(--text-faint);}

.section-heading{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;gap:10px;flex-wrap:wrap;}
.section-heading h2{font-size:16px;font-weight:800;}

/* ---------- calendar ---------- */
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.cal-toolbar .cal-title{font-size:16px;font-weight:800;min-width:170px;font-family:var(--font-mono);}
.cal-nav{display:flex;gap:6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{font-size:11.5px;font-weight:700;color:var(--text-secondary);text-align:center;padding-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
.cal-cell{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;min-height:92px;padding:7px;
  display:flex;flex-direction:column;gap:4px;cursor:pointer;
}
.cal-cell.blank{background:transparent;border-color:transparent;cursor:default;}
.cal-cell:not(.blank):hover{border-color:var(--border-strong);background:var(--surface-hover);}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.cal-daynum{font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--text-secondary);}
.cal-cell.today .cal-daynum{color:var(--accent);font-weight:700;}
.cal-chip{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;overflow:hidden;}
.cal-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-more{font-size:10.5px;color:var(--text-faint);font-weight:700;}
@media (max-width:700px){.cal-cell{min-height:64px;}.cal-chip span{display:none;}}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;}

/* ---------- table ---------- */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end;}
.filter-bar .field{min-width:150px;}
.filter-bar .field.search{flex:1;min-width:200px;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-sm);}
table{width:100%;border-collapse:collapse;min-width:760px;}
thead th{
  text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-secondary);
  padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:top;}
tbody tr{cursor:pointer;}
tbody tr:hover td{background:var(--surface-hover);}
tbody tr:last-child td{border-bottom:none;}
.ev-title{font-weight:700;}
.ev-desc{color:var(--text-secondary);font-size:12.5px;margin-top:2px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- responsive table -> card list ---------- */
@media (max-width:680px){
  .table-wrap.rcards{overflow:visible;border:none;background:none;box-shadow:none;}
  .table-wrap.rcards table{width:100%;min-width:0;}
  .table-wrap.rcards thead{display:none;}
  .table-wrap.rcards tbody{display:flex;flex-direction:column;gap:10px;}
  .table-wrap.rcards tr{
    display:flex;flex-wrap:wrap;align-items:flex-start;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:13px 14px;box-shadow:var(--shadow-sm);row-gap:0;
  }
  .table-wrap.rcards tr:hover td{background:transparent;}
  .table-wrap.rcards td{
    display:flex;flex:1 1 100%;justify-content:space-between;align-items:center;gap:12px;
    padding:6px 0;border-bottom:1px dashed var(--border);font-size:13.5px;order:1;text-align:right;
  }
  .table-wrap.rcards td:last-child{border-bottom:none;}
  .table-wrap.rcards td::before{
    content:attr(data-label);font-size:11px;font-weight:700;color:var(--text-secondary);
    text-transform:uppercase;letter-spacing:.03em;flex:none;padding-top:1px;
  }
  .table-wrap.rcards td.tc-primary{
    display:block;flex:1 1 auto;min-width:0;text-align:left;
    padding:0 0 10px;border-bottom:1px solid var(--border);margin-bottom:6px;order:-2;
  }
  .table-wrap.rcards td.tc-primary::before{content:none;}
  .table-wrap.rcards td.tc-primary .ev-title{font-size:14.5px;}
  .table-wrap.rcards td.tc-primary .ev-desc{white-space:normal;max-width:none;}
  .table-wrap.rcards td.tc-status{
    display:block;flex:0 0 auto;order:-1;padding:0 0 10px;border-bottom:1px solid var(--border);margin-bottom:6px;margin-left:10px;
  }
  .table-wrap.rcards td.tc-status::before{content:none;}
  .table-wrap.rcards td.tc-empty{display:block;flex:1 1 100%;padding:8px 0;text-align:left;}
  .table-wrap.rcards td.tc-empty::before{content:none;}
}

/* ---------- requests board ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
.board.board-3{grid-template-columns:repeat(3,minmax(0,1fr));}
@media (max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr));}.board.board-3{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:620px){.board{grid-template-columns:minmax(0,1fr);}.board.board-3{grid-template-columns:minmax(0,1fr);}}
.board-col{background:var(--surface-muted);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px;min-height:80px;min-width:0;}
.board-col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px;}
.board-col-head h4{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--text-secondary);}
.board-col-head .count{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);}
.board-cards{display:flex;flex-direction:column;gap:10px;}
.req-card{
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--priority-medium);
  border-radius:10px;padding:11px 12px;cursor:pointer;box-shadow:var(--shadow-sm);min-width:0;
}
.req-card:hover{background:var(--surface-hover);}
.req-card .req-type{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint);margin-bottom:4px;}
.req-card .req-title{font-weight:700;font-size:13.5px;margin-bottom:5px;}
.req-card .req-desc{font-size:12px;color:var(--text-secondary);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.req-card .req-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--text-secondary);}
.req-card .req-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--text-faint);}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,14,17,.5);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:100;overflow-y:auto;
}
.modal-panel{
  background:var(--bg-raised);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);width:100%;max-width:560px;
  padding:22px;max-height:calc(100vh - 40px);overflow-y:auto;
}
.modal-panel.wide{max-width:640px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;}
.modal-head h3{font-size:17px;font-weight:800;}
.modal-close{border:none;background:transparent;color:var(--text-secondary);cursor:pointer;padding:4px;border-radius:8px;}
.modal-close:hover{background:var(--surface-hover);}
.modal-form{display:flex;flex-direction:column;gap:12px;}
.modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:10px;flex-wrap:wrap;}
.modal-actions .right{display:flex;gap:8px;}

.swatches{display:flex;gap:8px;flex-wrap:wrap;}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;filter:brightness(var(--dept-brightness));}
.swatch.selected{border-color:var(--text);box-shadow:0 0 0 2px var(--bg-raised) inset;}

.comments{border-top:1px solid var(--border);margin-top:6px;padding-top:14px;}
.comments h4{font-size:13px;font-weight:800;margin-bottom:10px;}
.comment-item{padding:9px 10px;border-radius:9px;background:var(--surface-muted);margin-bottom:8px;}
.comment-item .c-head{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-secondary);margin-bottom:3px;}
.comment-item .c-author{font-weight:700;color:var(--text);}
.comment-item .c-text{font-size:13px;}
.comment-add{display:flex;gap:8px;margin-top:10px;}
.comment-add input[type="text"]{flex:1;}

.status-planned,.status-new{color:var(--status-neutral);background:var(--status-neutral-bg);}
.status-in_progress{color:var(--status-progress);background:var(--status-progress-bg);}
.status-done,.status-resolved{color:var(--status-done);background:var(--status-done-bg);}
.status-overdue{color:var(--status-overdue);background:var(--status-overdue-bg);}
.status-on_hold{color:var(--status-neutral);background:var(--status-neutral-bg);}

.empty-state{padding:34px 16px;text-align:center;color:var(--text-faint);font-size:13.5px;}

/* ---------- tab badge ---------- */
.tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-contrast);font-size:10.5px;font-weight:800;margin-left:6px;vertical-align:2px;}

/* ---------- quick actions ---------- */
.quick-actions{display:flex;flex-wrap:wrap;gap:8px;}

/* ---------- staff directory (inside department modal) ---------- */
.staff-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.staff-row{display:flex;align-items:center;gap:8px;background:var(--surface-muted);border-radius:9px;padding:7px 10px;}
.staff-row .s-name{font-weight:700;font-size:13px;}
.staff-row .s-pos{color:var(--text-secondary);font-size:12px;flex:1;}
.staff-row .s-remove{border:none;background:transparent;color:var(--text-faint);cursor:pointer;padding:2px 6px;border-radius:6px;font-size:13px;}
.staff-row .s-remove:hover{background:var(--status-overdue-bg);color:var(--status-overdue);}
.staff-add-row{display:flex;gap:6px;}
.staff-add-row input{flex:1;}
.resp-pick{font-size:12.5px;color:var(--text-secondary);}

/* ---------- messages ---------- */
.msg-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;margin-bottom:8px;min-width:0;}
.msg-row:hover{background:var(--surface-hover);}
.msg-row.unread{border-color:var(--accent);background:var(--accent-soft);}
.msg-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;}
.msg-row:not(.unread) .msg-dot{background:transparent;}
.msg-row .msg-subject{font-weight:700;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.msg-row .msg-to{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
.msg-row .msg-date{font-size:11.5px;color:var(--text-faint);white-space:nowrap;}
.msg-detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;font-size:12.5px;color:var(--text-secondary);}
.msg-detail-body{background:var(--surface-muted);border-radius:10px;padding:12px;font-size:13.5px;white-space:pre-wrap;}
</style>

/* ================= utils ================= */
function pad(n){ return String(n).padStart(2,'0'); }
function toIso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayIso(){ return toIso(new Date()); }
function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function fmtDate(iso){ if(!iso) return '—'; var p=iso.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
function fmtDateTime(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d)) return iso; return fmtDate(toIso(d))+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function deptById(id){ for(var i=0;i<departments.length;i++){ if(departments[i].id===id) return departments[i]; } return null; }

  return html;
}
function effectiveDate(ev){
  if((ev.type==='task'||ev.type==='project') && ev.dueDate) return ev.dueDate;
  return ev.startDate;
}
function computedStatus(ev){
  if(ev.status==='done') return 'done';
  var eff = effectiveDate(ev);
  if(eff && eff < todayIso()) return 'overdue';
  return ev.status;
}
function statusPill(code, labelMap){

/* ================= data access ================= */

function getArr(coll){
  if(!COLL_MAP){

      requests: function(){ return requests; },
      staff: function(){ return staff; },
      reagents: function(){ return reagents; },
      labIncidents: function(){ return labIncidents; },
      stock: function(){ return stock; },
      procurement: function(){ return procurement; },
      messages: function(){ return messages; }
    };
  }
  return COLL_MAP[coll]();
}
function staffByDept(deptId){ return staff.filter(function(s){ return s.departmentId===deptId; }); }

function createDoc(coll, data){
  if(usingDb){
    return db.collection(coll).add(data).then(function(ref){ return ref.id; }).catch(function(e){ console.error(e); throw e; });
  }
  var id = genLocalId(coll);
  getArr(coll).push(Object.assign({id:id}, data));
  renderApp();
  return Promise.resolve(id);
}
function updateDocFn(coll, id, data){
  if(usingDb){
    return db.collection(coll).doc(id).update(data).catch(function(e){ console.error(e); throw e; });
  }
  var arr=getArr(coll);
  for(var i=0;i<arr.length;i++){ if(arr[i].id===id){ Object.assign(arr[i], data); break; } }
  renderApp();
  return Promise.resolve();
}
function deleteDocFn(coll, id){
  if(usingDb){
    return db.collection(coll).doc(id).delete().catch(function(e){ console.error(e); throw e; });
  }
  var arr=getArr(coll);
  for(var i=0;i<arr.length;i++){ if(arr[i].id===id){ arr.splice(i,1); break; } }
  renderApp();
  return Promise.resolve();
}

function seedLocal(){

/* ================= init ================= */
function init(){
  applyTheme();
  bindStaticEvents();
  renderRoleBadge();
  renderTabsBar();

  var use = (window.claude && window.claude.use) ? window.claude.use('db') : Promise.resolve(null);
  use.then(function(ns){
    if(!ns){ usingDb=false; seedLocal(); renderApp(); return; }
    db = ns; usingDb = true;
    return db.collection('departments').get().then(function(snap){
      if(snap.empty){ return seedAllDb(); }
    }).then(function(){
      subscribe();
    }).catch(function(e){
      console.error('seed/subscribe error', e);
      subscribe();
    });
  }).catch(function(e){
    console.error('db init error', e);
    usingDb=false; seedLocal(); renderApp();
  });
}
function subscribe(){
  db.collection('departments').onSnapshot(function(snap){
    departments = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    renderApp();
  }, onDbError);
  db.collection('events').onSnapshot(function(snap){
    events = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    renderApp();
  }, onDbError);
  db.collection('requests').onSnapshot(function(snap){
    requests = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    renderApp();
  }, onDbError);
  db.collection('staff').onSnapshot(function(snap){
    staff = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    renderApp();
  }, onDbError);
  db.collection('reagents').onSnapshot(function(snap){
    reagents = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    renderApp();
  }, onDbError);
  db.collection('labIncidents').onSnapshot(function(snap){
    labIncidents = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    renderApp();
  }, onDbError);
  db.collection('stock').onSnapshot(function(snap){
    stock = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    renderApp();
  }, onDbError);
  db.collection('procurement').onSnapshot(function(snap){
    procurement = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    renderApp();
  }, onDbError);
  db.collection('messages').onSnapshot(function(snap){
    messages = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    renderApp();
  }, onDbError);
}
function onDbError(err){
  console.error('db subscription error', err);
  if(!dbErrored){
    dbErrored = true;
    usingDb = false;
    if(!departments.length) seedLocal();
    renderApp();
  }
}

/* ================= theme ================= */
function applyTheme(){
  var root = document.documentElement;
  if(themeChoice==='light' || themeChoice==='dark'){ root.setAttribute('data-theme', themeChoice); }
  else { root.removeAttribute('data-theme'); }
  var btns = document.querySelectorAll('#themeToggle button');
  btns.forEach(function(b){
    var c = b.getAttribute('data-theme-choice');
    var isActive = (c==='system' && !themeChoice) || c===themeChoice;
    b.classList.toggle('active', isActive);
  });
}

/* ================= role ================= */
function renderRoleBadge(){
  var el = document.getElementById('roleBadge');
  if(!el) return;
  if(currentRole && ROLE_LABELS[currentRole]){
    el.classList.add('has-role');
    el.innerHTML = '<span class="role-badge-icon">'+roleIconSvg(currentRole)+'</span><span>'+esc(ROLE_LABELS[currentRole])+'</span>';
  } else {
    el.classList.remove('has-role');
    el.innerHTML = '<span class="role-badge-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.4-4 4-6 7-6s5.6 2 7 6"/></svg></span><span>Выбрать роль</span>';
  }
}
function openRoleModal(){
  var html = ''
    +'<div class="modal-head"><h3>Кто вы?</h3><button class="modal-close" data-close>✕</button></div>'
    +'<div class="role-hint">Роль сохранится в этом браузере и будет подставляться как ответственный в новых карточках и автор комментариев.</div>'
    +'<div class="role-grid">'
      +ROLES.map(function(r){
        return '<button type="button" class="role-option'+(r.id===currentRole?' selected':'')+'" data-role="'+r.id+'">'
          +'<span class="role-icon">'+roleIconSvg(r.id)+'</span><span>'+esc(r.label)+'</span>'
        +'</button>';
      }).join('')
    +'</div>';
  openModal(html, function(root){
    root.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeModal); });
    root.querySelectorAll('[data-role]').forEach(function(b){
      b.addEventListener('click', function(){
        currentRole = b.getAttribute('data-role');
        try{ localStorage.setItem('hema_role', currentRole); }catch(e){}
        renderRoleBadge();
        fillQuickActions();
        closeModal();
      });

}

/* ================= static bindings ================= */
function bindStaticEvents(){
  document.getElementById('themeToggle').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-theme-choice]');
    if(!btn) return;
    var c = btn.getAttribute('data-theme-choice');
    themeChoice = (c==='system') ? null : c;
    try{ if(themeChoice) localStorage.setItem('hema_theme', themeChoice); else localStorage.removeItem('hema_theme'); }catch(err){}
    applyTheme();
  });
  document.getElementById('roleBadge').addEventListener('click', openRoleModal);
}

/* ================= top-level render ================= */
function renderApp(){
  renderDemoBanner();
  renderRoleBadge();
  renderTabsBar();
  if(activeTab !== lastRenderedTab){
    renderContentFull();
    lastRenderedTab = activeTab;
  } else {
    refreshDynamic();
  }
  if(!currentRole && !roleModalShown){
    roleModalShown = true;
    setTimeout(function(){ if(!currentRole) openRoleModal(); }, 500);
  }
}
function renderDemoBanner(){
  var slot = document.getElementById('demoBannerSlot');
  if(!usingDb){
    slot.innerHTML = '<div class="demo-banner">Демонстрационный режим: общее хранилище недоступно, изменения не будут сохранены.</div>';
  } else {
    slot.innerHTML = '';
  }
}
function renderTabsBar(){
  var el = document.getElementById('tabsBar');
  var unread = messages.filter(function(m){ return !m.read; }).length;
  el.innerHTML = TABS.map(function(t){
    var badge = (t.id==='messages' && unread>0) ? '<span class="tab-badge">'+unread+'</span>' : '';
    return '<button class="tab-btn'+(t.id===activeTab?' active':'')+'" data-tab="'+t.id+'">'+t.label+badge+'</button>';
  }).join('');
  el.onclick = function(e){
    var btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    activeTab = btn.getAttribute('data-tab');
    renderApp();
  };
}
function renderContentFull(){
  var el = document.getElementById('content');
  if(activeTab==='overview') el.innerHTML = overviewHtml();
  else if(activeTab==='calendar') el.innerHTML = calendarHtml();
  else if(activeTab==='events') el.innerHTML = eventsTabHtml();
  else if(activeTab==='requests') el.innerHTML = requestsTabHtml();
  else if(activeTab==='reagents') el.innerHTML = reagentsTabHtml();
  else if(activeTab==='pharmacy') el.innerHTML = pharmacyTabHtml();
  else if(activeTab==='messages') el.innerHTML = messagesTabHtml();
  else el.innerHTML = departmentsTabHtml();
  bindContentEvents();
  refreshDynamic();
}
function refreshDynamic(){
  if(activeTab==='overview') fillOverviewDynamic();
  else if(activeTab==='calendar') fillCalendarGrid();
  else if(activeTab==='events') fillEventsList();
  else if(activeTab==='requests') fillRequestsBoard();
  else if(activeTab==='reagents') fillReagentsDynamic();
  else if(activeTab==='pharmacy') fillPharmacyDynamic();
  else if(activeTab==='messages') fillMessagesDynamic();
  else if(activeTab==='departments') fillDepartmentsGrid();
}
function bindContentEvents(){
  var el = document.getElementById('content');
  el.onclick = function(e){
    var addEvBtn = e.target.closest('[data-action="add-event"]');
    if(addEvBtn){ openEventModal(null, addEvBtn.getAttribute('data-date')||''); return; }
    var addReqBtn = e.target.closest('[data-action="add-request"]');
    if(addReqBtn){ openRequestModal(null); return; }
    var addDepBtn = e.target.closest('[data-action="add-department"]');
    if(addDepBtn){ openDepartmentModal(null); return; }
    var addReagentBtn = e.target.closest('[data-action="add-reagent"]');
    if(addReagentBtn){ openReagentModal(null); return; }
    var addIncidentBtn = e.target.closest('[data-action="add-incident"]');
    if(addIncidentBtn){ openIncidentModal(null); return; }
    var addStockBtn = e.target.closest('[data-action="add-stock"]');
    if(addStockBtn){ openStockModal(null); return; }
    var addProcBtn = e.target.closest('[data-action="add-procurement"]');
    if(addProcBtn){ openProcurementModal(null); return; }
    var addMsgBtn = e.target.closest('[data-action="add-message"]');
    if(addMsgBtn){ openMessageModal(null); return; }

    var evRow = e.target.closest('[data-open-event]');
    if(evRow){ openEventModal(evRow.getAttribute('data-open-event')); return; }
    var reqCard = e.target.closest('[data-open-request]');
    if(reqCard){ openRequestModal(reqCard.getAttribute('data-open-request')); return; }
    var depCard = e.target.closest('[data-open-department]');
    if(depCard){ openDepartmentModal(depCard.getAttribute('data-open-department')); return; }
    var reagentRow = e.target.closest('[data-open-reagent]');
    if(reagentRow){ openReagentModal(reagentRow.getAttribute('data-open-reagent')); return; }
    var incidentCard = e.target.closest('[data-open-incident]');
    if(incidentCard){ openIncidentModal(incidentCard.getAttribute('data-open-incident')); return; }
    var stockRow = e.target.closest('[data-open-stock]');
    if(stockRow){ openStockModal(stockRow.getAttribute('data-open-stock')); return; }
    var procRow = e.target.closest('[data-open-procurement]');
    if(procRow){ openProcurementModal(procRow.getAttribute('data-open-procurement')); return; }
    var msgRow = e.target.closest('[data-open-message]');
    if(msgRow){ openMessageModal(msgRow.getAttribute('data-open-message')); return; }
    var jumpTab = e.target.closest('[data-jump-tab]');
    if(jumpTab){ activeTab = jumpTab.getAttribute('data-jump-tab'); lastRenderedTab=null; renderApp(); return; }
    var quickBtn = e.target.closest('[data-quick]');
    if(quickBtn){
      var qk = quickBtn.getAttribute('data-quick');
      if(qk==='pick-role') openRoleModal();
      else if(qk==='assign-task') openEventModal(null);
      else if(qk==='compose-message') openMessageModal(null);
      else if(qk==='clinical-task') openEventModal(null, '', 'task');
      else if(qk==='protocol-event') openEventModal(null, '', 'project');
      else if(qk==='procurement-new'){ activeTab='pharmacy'; lastRenderedTab=null; renderApp(); setTimeout(function(){ openProcurementModal(null); },0); }
      else if(qk==='view-stock'){ activeTab='pharmacy'; lastRenderedTab=null; renderApp(); }
      else if(qk==='reagent-new'){ activeTab='reagents'; lastRenderedTab=null; renderApp(); setTimeout(function(){ openReagentModal(null); },0); }
      else if(qk==='incident-new'){ activeTab='reagents'; lastRenderedTab=null; renderApp(); setTimeout(function(){ openIncidentModal(null); },0); }
      return;
    }
    var depJump = e.target.closest('[data-jump-department]');
    if(depJump){
      evFilters = {dept:depJump.getAttribute('data-jump-department'), type:'', status:'', q:''};
      activeTab='events'; lastRenderedTab=null; renderApp(); return;
    }
    var dayCell = e.target.closest('[data-open-day]');
    if(dayCell){ openDayModal(dayCell.getAttribute('data-open-day')); return; }
    var calPrev = e.target.closest('[data-cal-prev]');
    if(calPrev){ calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()-1, 1); fillCalendarGrid(); updateCalTitle(); return; }
    var calNext = e.target.closest('[data-cal-next]');
    if(calNext){ calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()+1, 1); fillCalendarGrid(); updateCalTitle(); return; }
    var calToday = e.target.closest('[data-cal-today]');
    if(calToday){ calCursor = startOfMonth(new Date()); fillCalendarGrid(); updateCalTitle(); return; }
  };
  el.oninput = function(e){
    if(e.target.id==='evSearch'){ evFilters.q = e.target.value; fillEventsList(); }
    if(e.target.id==='reqSearch'){ reqFilters.q = e.target.value; fillRequestsBoard(); }
    if(e.target.id==='msgSearch'){ msgFilters.q = e.target.value; fillMessagesDynamic(); }
  };
  el.onchange = function(e){
    if(e.target.id==='evDeptFilter'){ evFilters.dept = e.target.value; fillEventsList(); }
    if(e.target.id==='evTypeFilter'){ evFilters.type = e.target.value; fillEventsList(); }
    if(e.target.id==='evStatusFilter'){ evFilters.status = e.target.value; fillEventsList(); }
    if(e.target.id==='reqDeptFilter'){ reqFilters.dept = e.target.value; fillRequestsBoard(); }
    if(e.target.id==='reqTypeFilter'){ reqFilters.type = e.target.value; fillRequestsBoard(); }
    if(e.target.id==='reqStatusFilter'){ reqFilters.status = e.target.value; fillRequestsBoard(); }
    if(e.target.id==='reqPriorityFilter'){ reqFilters.priority = e.target.value; fillRequestsBoard(); }
    if(e.target.id==='msgDeptFilter'){ msgFilters.dept = e.target.value; fillMessagesDynamic(); }
  };
}

function fillOverviewDynamic(){
  fillQuickActions();
  var kpiEl = document.getElementById('kpiGrid');
  if(!kpiEl) return;
  var today = todayIso();
  var in7 = toIso(addDays(new Date(),7));
  var activeTasksProjects = events.filter(function(e){ return (e.type==='task'||e.type==='project') && computedStatus(e)!=='done'; }).length;
  var deadlines7 = events.filter(function(e){ var eff=effectiveDate(e); return eff && eff>=today && eff<=in7 && e.status!=='done'; }).length;
  var projectsInProgress = events.filter(function(e){ return e.type==='project' && e.status==='in_progress'; }).length;
  var openRequests = requests.filter(function(r){ return r.status!=='resolved'; }).length;
  var kpis = [
    {v:activeTasksProjects, l:'Активные задачи и проекты'},
    {v:deadlines7, l:'Дедлайны в ближайшие 7 дней'},
    {v:projectsInProgress, l:'Проекты в работе'},
    {v:openRequests, l:'Открытые заявки'},
    {v:departments.length, l:'Подразделений'}
  ];
  kpiEl.innerHTML = kpis.map(function(k){ return '<div class="kpi-tile"><div class="kpi-value mono">'+k.v+'</div><div class="kpi-label">'+k.l+'</div></div>'; }).join('');

  var upcoming = events.filter(function(e){ return computedStatus(e)!=='done'; })
    .slice().sort(function(a,b){ return (effectiveDate(a)||'9999').localeCompare(effectiveDate(b)||'9999'); })
    .slice(0,6);
  var upcomingEl = document.getElementById('upcomingList');
  upcomingEl.innerHTML = upcoming.length ? upcoming.map(function(e){
    var d = deptById(e.departmentId);
    var st = computedStatus(e);
    return '<div class="list-row" data-open-event="'+e.id+'">'
      +(d?'<span class="dept-dot" style="background:'+d.color+'"></span>':'')
      +'<span class="lr-title">'+esc(e.title)+'</span>'
      +statusPill(st, EV_STATUS_LABELS)
      +'<span class="lr-meta mono">'+fmtDate(effectiveDate(e))+'</span>'
    +'</div>';
  }).join('') : '<div class="empty-note">Нет ближайших событий.</div>';

  var attention = requests.filter(function(r){ return r.status!=='resolved'; })
    .slice().sort(function(a,b){

function calendarHtml(){

        +'<button class="btn btn-sm" data-cal-next>След. →</button>'
      +'</div>'
    +'</div>'
    +'<div class="cal-grid" id="calGrid"></div>'
    +'<div class="cal-legend" id="calLegend"></div>';
}
function updateCalTitle(){
  var t = document.getElementById('calTitle');
  if(t) t.textContent = MONTHS[calCursor.getMonth()]+' '+calCursor.getFullYear();
}
function fillCalendarGrid(){
  var gridEl = document.getElementById('calGrid');
  if(!gridEl) return;
  updateCalTitle();
  var byDate = {};
  events.forEach(function(e){
    var dates = [e.startDate];
    if((e.type==='task'||e.type==='project') && e.dueDate && e.dueDate!==e.startDate) dates.push(e.dueDate);
    dates.forEach(function(dt){
      if(!dt) return;
      if(!byDate[dt]) byDate[dt]=[];
      byDate[dt].push(e);
    });
  });
  var y = calCursor.getFullYear(), m = calCursor.getMonth();
  var first = new Date(y,m,1);
  var leading = (first.getDay()+6)%7;
  var total = daysInMonth(calCursor);
  var cells = [];
  for(var i=0;i<leading;i++) cells.push(null);
  for(var d=1; d<=total; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  var today = todayIso();
  var html = DOW.map(function(w){ return '<div class="cal-dow">'+w+'</div>'; }).join('');
  html += cells.map(function(d){
    if(d===null) return '<div class="cal-cell blank"></div>';
    var iso = y+'-'+pad(m+1)+'-'+pad(d);
    var isToday = iso===today;
    var dayEvents = byDate[iso]||[];
    var visible = dayEvents.slice(0,4);
    var extra = dayEvents.length - visible.length;
    var chips = visible.map(function(e){
      var dep = deptById(e.departmentId);
      var color = dep ? dep.color : 'var(--text-faint)';
      return '<div class="cal-chip"><span class="dept-dot" style="background:'+color+'"></span><span>'+esc(e.title)+'</span></div>';
    }).join('');
    return '<div class="cal-cell'+(isToday?' today':'')+'" data-open-day="'+iso+'">'
      +'<div class="cal-daynum">'+d+'</div>'
      +chips
      +(extra>0 ? '<div class="cal-more">+'+extra+'</div>' : '')
    +'</div>';
  }).join('');
  gridEl.innerHTML = html;

  var legendEl = document.getElementById('calLegend');
  legendEl.innerHTML = departments.map(function(dep){
    return '<span class="dept-chip"><span class="dept-dot" style="background:'+dep.color+'"></span>'+esc(dep.name)+'</span>';
  }).join('');
}
function openDayModal(iso){
  var dayEvents = events.filter(function(e){
    var dates=[e.startDate];
    if((e.type==='task'||e.type==='project') && e.dueDate && e.dueDate!==e.startDate) dates.push(e.dueDate);
    return dates.indexOf(iso)>-1;
  });
  var html = ''
    +'<div class="modal-head"><h3>'+fmtDate(iso)+'</h3><button class="modal-close" data-close>✕</button></div>'
    +'<div class="panel-list" style="margin-bottom:14px;">'
      +(dayEvents.length ? dayEvents.map(function(e){
        var d = deptById(e.departmentId);
        return '<div class="list-row" data-open-event="'+e.id+'" data-close-parent="1">'
          +(d?'<span class="dept-dot" style="background:'+d.color+'"></span>':'')
          +'<span class="lr-title">'+esc(e.title)+'</span>'
          +statusPill(computedStatus(e), EV_STATUS_LABELS)
        +'</div>';
      }).join('') : '<div class="empty-note">На эту дату событий нет.</div>')
    +'</div>'
    +'<button class="btn btn-primary" data-action="add-event" data-date="'+iso+'" data-close-parent="1">+ Добавить событие</button>';
  openModal(html, function(root){
    root.addEventListener('click', function(e){
      if(e.target.closest('[data-close]')) { closeModal(); return; }
      if(e.target.closest('[data-close-parent]')){ closeModal(); }
    });
  });
}

    +'<div class="filter-bar">'
      +'<div class="field"><label>Подразделение-получатель</label><select id="msgDeptFilter">'+'<option value="">Все</option>'+deptOptions(msgFilters.dept,false)+'</select></div>'

    +'</div>'
    +'<div id="messagesList"></div>';

function messageRecipientDept(m){
  if(m.toType==='department') return m.toId;
  var s = staff.find(function(x){ return x.id===m.toId; });
  return s ? s.departmentId : '';
}
function fillMessagesDynamic(){
  var el = document.getElementById('messagesList');
  if(!el) return;
  var q = (msgFilters.q||'').toLowerCase();
  var list = messages.filter(function(m){
    if(msgFilters.dept && messageRecipientDept(m)!==msgFilters.dept) return false;
    if(q){
      var hay = ((m.subject||'')+' '+(m.body||'')).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  }).slice().sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });

  el.innerHTML = list.length ? list.map(function(m){
    return '<div class="msg-row'+(m.read?'':' unread')+'" data-open-message="'+m.id+'">'
      +'<span class="msg-dot"></span>'
      +'<span class="msg-subject">'+esc(m.subject)+'</span>'
      +'<span class="msg-to">→ '+esc(m.toLabel||'')+'</span>'
      +'<span class="msg-date mono">'+fmtDateTime(m.createdAt)+'</span>'
    +'</div>';
  }).join('') : '<div class="empty-state">Сообщений нет.</div>';
}

/* ================= MODAL: generic ================= */
function openModal(innerHtml, onMount, wide){
  var root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal-panel'+(wide?' wide':'')+'">'+innerHtml+'</div></div>';
  document.body.style.overflow = 'hidden';
  document.getElementById('modalOverlay').addEventListener('click', function(e){ if(e.target.id==='modalOverlay') closeModal(); });
  document.addEventListener('keydown', escListener);
  if(onMount) onMount(root);
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  document.body.style.overflow = '';
  document.removeEventListener('keydown', escListener);
}
function escListener(e){ if(e.key==='Escape') closeModal(); }
function bindDeleteButton(btn, onConfirm){
  var pending = false, timer = null;
  var original = btn.textContent;
  btn.addEventListener('click', function(){
    if(!pending){
      pending = true;
      btn.textContent = 'Точно удалить?';
      btn.classList.add('btn-danger-confirm');
      timer = setTimeout(function(){ pending=false; btn.textContent=original; btn.classList.remove('btn-danger-confirm'); }, 3000);
    } else {
      clearTimeout(timer);
      onConfirm();
    }
  });
}

    +'<h4>Лента комментариев</h4>'
    +(sorted.length ? sorted.map(function(c){
      return '<div class="comment-item"><div class="c-head"><span class="c-author">'+esc(c.author)+'</span><span class="mono">'+fmtDateTime(c.createdAt)+'</span></div><div class="c-text">'+esc(c.text)+'</div></div>';

  return '<option value="">— выбрать из справочника —</option>' + list.map(function(s){ return '<option value="'+s.id+'">'+esc(s.name)+' — '+esc(s.position||'')+'</option>'; }).join('');

/* ================= MODAL: message ================= */
function openMessageModal(id){
  var m = id ? messages.find(function(x){ return x.id===id; }) : null;
  if(m && !m.read){ updateDocFn('messages', m.id, {read:true}); }
  if(m){
    var d = deptById(messageRecipientDept(m));
    var html = ''
      +'<div class="modal-head"><h3>'+esc(m.subject)+'</h3><button class="modal-close" data-close>✕</button></div>'
      +'<div class="msg-detail-meta">'
        +'<span>От: '+esc(ROLE_LABELS[m.fromRole]||'Не указано')+'</span>'
        +'<span>Кому: '+esc(m.toLabel||'')+(d?(' <span class="dept-dot" style="background:'+d.color+';display:inline-block;"></span>'):'')+'</span>'
        +'<span class="mono">'+fmtDateTime(m.createdAt)+'</span>'
      +'</div>'
      +'<div class="msg-detail-body">'+esc(m.body)+'</div>'
      +'<div class="modal-actions" style="margin-top:16px;"><span></span><div class="right"><button class="btn" data-close>Закрыть</button></div></div>';
    openModal(html, function(root){
      root.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeModal); });
    }, false);
    return;
  }
  var staffOptions = staff.map(function(s){ var d=deptById(s.departmentId); return '<option value="'+s.id+'">'+esc(s.name)+' — '+esc(s.position)+(d?(' ('+esc(d.name)+')'):'')+'</option>'; }).join('');
  var html2 = ''
    +'<div class="modal-head"><h3>Новое сообщение</h3><button class="modal-close" data-close>✕</button></div>'
    +'<div class="modal-form">'
      +'<div class="field-row">'
        +'<div class="field"><label>Кому</label><select id="mg-toType"><option value="department">Подразделению</option><option value="staff">Сотруднику</option></select></div>'
        +'<div class="field" id="mg-toDeptRow"><label>Подразделение</label><select id="mg-toDept">'+deptOptions('',false)+'</select></div>'
        +'<div class="field" id="mg-toStaffRow" style="display:none;"><label>Сотрудник</label><select id="mg-toStaff">'+staffOptions+'</select></div>'
      +'</div>'
      +'<div class="field"><label>Тема</label><input type="text" id="mg-subject" placeholder="Кратко о чём сообщение"></div>'
      +'<div class="field"><label>Текст сообщения</label><textarea id="mg-body" rows="4"></textarea></div>'
      +'<div class="modal-actions"><span></span><div class="right"><button class="btn" data-close>Отмена</button><button class="btn btn-primary" id="mg-send">Отправить</button></div></div>'
    +'</div>';
  openModal(html2, function(root){
    root.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeModal); });
    var toTypeSel = root.querySelector('#mg-toType');
    toTypeSel.addEventListener('change', function(){
      var isStaff = toTypeSel.value==='staff';
      root.querySelector('#mg-toDeptRow').style.display = isStaff ? 'none' : '';
      root.querySelector('#mg-toStaffRow').style.display = isStaff ? '' : 'none';
    });
    root.querySelector('#mg-send').addEventListener('click', function(){
      var subject = root.querySelector('#mg-subject').value.trim();
      var body = root.querySelector('#mg-body').value.trim();
      if(!subject || !body){ root.querySelector(subject?'#mg-body':'#mg-subject').focus(); return; }
      var isStaff = toTypeSel.value==='staff';
      var toId, toLabel;
      if(isStaff){
        var sId = root.querySelector('#mg-toStaff').value;
        var sObj = staff.find(function(x){ return x.id===sId; });
        toId = sId; toLabel = sObj ? sObj.name : '';
      } else {
        var dId = root.querySelector('#mg-toDept').value;
        var dObj = deptById(dId);
        toId = dId; toLabel = dObj ? dObj.name : '';
      }
      if(!toId || !toLabel) return;
      var payload = {
        toType:isStaff?'staff':'department',
        toId:toId,
        toLabel:toLabel,
        fromRole:currentRole||'',
        subject:subject,
        body:body,
        relatedType:'',
        relatedId:'',
        createdAt:new Date().toISOString(),
        read:false
      };
      createDoc('messages', payload).then(closeModal);
    });
  }, false);
}
